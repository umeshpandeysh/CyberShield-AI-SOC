name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest python-jose[cryptography] passlib bcrypt==3.2.2 httpx2 email-validator
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Debug Import Paths
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import sys; print(sys.path)"
          python -c "import backend; print('backend imported successfully')"

      - name: Run Backend Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Lint and build frontend
        run: |
          cd frontend
          if [ -d src ] && [ "$(find src -name '*.ts' -o -name '*.tsx' 2>/dev/null | wc -l)" -gt 0 ]; then
            npm run lint --if-present
            npm run build --if-present
          else
            echo "No frontend source code found yet. Skipping linting and building."
          fi
