services:
  # 1. FastAPI Backend Web Service (Render Free Tier)
  - type: web
    name: cybershield-backend
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "chmod +x ./scripts/start_backend.sh && ./scripts/start_backend.sh"
    envVars:
      - key: PYTHONPATH
        value: "backend:."
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend Static Site (Render Free Tier)
  - type: web
    name: cybershield-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cybershield-backend
          property: host
