services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: cybershield-backend
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "chmod +x ./scripts/start_backend.sh && ./scripts/start_backend.sh"
    envVars:
      - key: PYTHONPATH
        value: "backend:."
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: cybershield-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: cybershield-redis
          property: port
      - key: SECRET_KEY
        generateValue: true

  # 2. Celery Background Worker Service
  - type: worker
    name: cybershield-celery-worker
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "export PYTHONPATH=backend:. && celery -A app.adapters.celery_app.celery_app worker --loglevel=info"
    envVars:
      - key: PYTHONPATH
        value: "backend:."
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: cybershield-redis
          property: port
      - key: REDIS_PORT
        fromService:
          type: redis
          name: cybershield-redis
          property: port

  # 3. React Frontend Static Site
  - type: static
    name: cybershield-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cybershield-backend
          property: url

databases:
  # 4. PostgreSQL Managed Database
  - name: cybershield-postgres
    databaseName: cybershield_db
    user: postgres
    plan: free

# 5. Redis Managed Key-Value Store
redis:
  - name: cybershield-redis
    plan: free
