version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: cybershield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-cybershield_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybershield-network

  # Cache & Task Queue Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: cybershield-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_456}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybershield-network

  # ClamAV Antivirus Daemon
  clamav:
    image: clamav/clamav:stable
    container_name: cybershield-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - cybershield-network

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: cybershield-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-CyberShield-AI-SOC}
      - ENV=${ENV:-development}
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-cybershield_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_456}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - cybershield-network

  # AI Inference Engine
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: ../docker/Dockerfile.ai
    container_name: cybershield-ai-engine
    restart: unless-stopped
    environment:
      - ENV=${ENV:-development}
      - PHISHING_MODEL_PATH=${PHISHING_MODEL_PATH:-models/phishing_detector_v1}
      - SPAM_MODEL_PATH=${SPAM_MODEL_PATH:-models/spam_classifier_v1}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.82}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_456}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    networks:
      - cybershield-network

  # React Analyst Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: cybershield-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - cybershield-network

networks:
  cybershield-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  clamavdata:
    driver: local
