version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cybershield-postgres
    restart: always
    environment:
      POSTGRES_DB: cybershield_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cybershield-redis
    restart: always
    command: redis-server --requirepass redis_secure_password_456
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_password_456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybershield-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password_123
      - POSTGRES_DB=cybershield_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_secure_password_456
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybershield-celery-worker
    command: celery -A app.adapters.celery_app.celery_app worker --loglevel=info
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password_123
      - POSTGRES_DB=cybershield_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_secure_password_456
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
